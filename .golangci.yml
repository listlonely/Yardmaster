version: "2"

linters:
  default: standard
  enable:
    - misspell
    - unconvert
    - unparam
  settings:
    errcheck:
      exclude-functions:
        # CLI 写 stdout/stderr 的返回值按惯例忽略；报告写 stderr 失败
        # 时进程退出码已无意义。
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        # defer Close 的错误忽略是 Go 惯例（读路径）；写路径显式处理。
        - (io.Closer).Close
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
