name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # GitHub Release 上传产物 + 重发同号 tag 时清理旧 Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # 单 job 串行完成构建→改名→校验和→发布：产物为裸二进制
      # （无 tar.gz/zip 打包层，下载即用；Linux 记得 chmod +x 或用
      # install.sh）。console 与 GUI 双入口各自独立成产物。
      - name: Build
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          # syso 资源（图标/版本属性/DPI manifest）构建时重新生成——
          # tools/genwinres 的 appVersion 常量随发版更新，仓库内预生成
          # 的 syso 会滞后一版（本机无 Go 时无法再生成），CI 现生成保证
          # release 产物的 exe 属性版本与 tag 一致（2026-11-11）。
          go generate ./cmd/yardmaster
          for t in linux/amd64: linux/arm64: windows/amd64:.exe; do
            os=${t%%/*}; rest=${t#*/}; arch=${rest%%:*}; ext=${rest#*:}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
              go build -trimpath -ldflags "-s -w -X yardmaster/internal/app.Version=$ver" \
              -o "pack/yardmaster-$os-$arch$ext" ./cmd/yardmaster
          done
          # GUI 桌面入口：Windows GUI subsystem，双击/开始菜单
          # 零终端黑窗（console 版 serve/CLI/headless 契约不变，见
          # docs/subsystems/app.md 五·甲）。-tags production：发版产物
          # 禁用 WebView2 DevTools（wails 非 production 构建默认启用，
          # F12 停靠右侧会把页面挤成窄条——2026-11-19 用户实测踩坑）。
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -tags production -trimpath -ldflags "-s -w -H=windowsgui -X yardmaster/internal/app.Version=$ver -X yardmaster/internal/app.guiSubsystem=1" \
            -o "pack/yardmaster-windows-app.exe" ./cmd/yardmaster-app
          # 便携包（2026-11-17）：exe 同级 data\ 目录自检测便携模式
          #（store.portableDir）——预置空 data 即标记，解压双击即用，
          # 数据全在包内（本地 bin\portable 同构）。
          port="pack-portable/Yardmaster-portable"
          mkdir -p "$port/data"
          # data 预置 README（2026-11-20）：纯空目录 zip 条目在部分
          # 解压路径（资源管理器拖拽单个文件、个别第三方工具）下不
          # 被还原——exe 同级检测不到 data\ 便落回用户主目录，便携
          # 失效。预置文件保证任何解压方式都还原 data 目录，用户打
          # 开即知此处用途（v0.2.5 用户实测踩坑）。
          cat > "$port/data/README.txt" <<EOF
          此目录是便携数据目录：启动后自动生成 settings.json /
          providers.json / rules.json 与 backup\ 留底快照。请勿删
          除本目录——它的存在即便携模式标记（数据随包走，不写用
          户主目录；删掉后数据会落到 ~/.yardmaster）。
          EOF
          cp pack/yardmaster-windows-amd64.exe "$port/yardmaster.exe"
          cp pack/yardmaster-windows-app.exe   "$port/yardmaster-app.exe"
          cat > "$port/说明.txt" <<EOF
          Yardmaster 便携版（v$ver）
          ==========================

          【启动】双击 yardmaster-app.exe——exe 检测同级 data\ 目录自动
          进入便携模式，数据全部落在本包 data\ 内（不读写用户主目录，
          无需任何参数）。

          【首次使用】启动后控制台 http://127.0.0.1:8317 添加厂商与
          API Key（存 data\providers.json）；拷走整个文件夹即完成迁移。

          【两个 exe】
            yardmaster-app.exe  桌面应用（日常使用）
            yardmaster.exe      命令行版（serve/CLI，同样自动便携）

          【注意】data\ 内含 API Key 明文（本机信任态设计），妥善保管；
          与安装版互不干扰；升级=新包 exe 覆盖，data\ 原样保留。
          EOF
          (cd pack-portable && zip -r "../pack/Yardmaster-portable-$ver-win64.zip" Yardmaster-portable)
      - name: Checksums
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          cd pack
          sha256sum yardmaster-* "Yardmaster-portable-$ver-win64.zip" > SHA256SUMS
          ls -l
      # 重发同号 tag（删 tag 重推）时删掉该 tag 名下的既有 Release，
      # 避免 action-gh-release 追加产物导致新旧资产混挂。
      - name: Clean existing release for this tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ids=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq -r --arg t "$GITHUB_REF_NAME" '.[] | select(.tag_name == $t) | .id')
          for id in $ids; do
            echo "deleting existing release $id (tag $GITHUB_REF_NAME)"
            curl -fsSL -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/$id"
          done
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pack/yardmaster-linux-amd64
            pack/yardmaster-linux-arm64
            pack/yardmaster-windows-amd64.exe
            pack/yardmaster-windows-app.exe
            pack/Yardmaster-portable-*-win64.zip
            pack/SHA256SUMS
            scripts/install.sh
            scripts/install.ps1
          generate_release_notes: true # changelog 由 PR/commit 生成
