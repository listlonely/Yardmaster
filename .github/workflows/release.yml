name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # GitHub Release 上传产物 + 重发同号 tag 时清理旧 Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # 单 job 串行完成构建→改名→校验和→发布：产物为裸二进制
      # （无 tar.gz/zip 打包层，下载即用；Linux 记得 chmod +x 或用
      # install.sh）。console 与 GUI 双入口各自独立成产物。
      - name: Build
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          for t in linux/amd64: linux/arm64: windows/amd64:.exe; do
            os=${t%%/*}; rest=${t#*/}; arch=${rest%%:*}; ext=${rest#*:}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
              go build -trimpath -ldflags "-s -w -X yardmaster/internal/app.Version=$ver" \
              -o "pack/yardmaster-$os-$arch$ext" ./cmd/yardmaster
          done
          # GUI 桌面入口：Windows GUI subsystem，双击/开始菜单
          # 零终端黑窗（console 版 serve/CLI/headless 契约不变，见
          # docs/subsystems/app.md 五·甲）。
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w -H=windowsgui -X yardmaster/internal/app.Version=$ver -X yardmaster/internal/app.guiSubsystem=1" \
            -o "pack/yardmaster-windows-app.exe" ./cmd/yardmaster-app
      - name: Checksums
        shell: bash
        run: |
          cd pack
          sha256sum yardmaster-* > SHA256SUMS
          ls -l
      # 重发同号 tag（删 tag 重推）时删掉该 tag 名下的既有 Release，
      # 避免 action-gh-release 追加产物导致新旧资产混挂。
      - name: Clean existing release for this tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ids=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq -r --arg t "$GITHUB_REF_NAME" '.[] | select(.tag_name == $t) | .id')
          for id in $ids; do
            echo "deleting existing release $id (tag $GITHUB_REF_NAME)"
            curl -fsSL -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/$id"
          done
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pack/yardmaster-linux-amd64
            pack/yardmaster-linux-arm64
            pack/yardmaster-windows-amd64.exe
            pack/yardmaster-windows-app.exe
            pack/SHA256SUMS
            scripts/install.sh
            scripts/install.ps1
          generate_release_notes: true # changelog 由 PR/commit 生成
