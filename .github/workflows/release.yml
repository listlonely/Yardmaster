name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # GitHub Release 上传产物

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # 单 job 串行完成构建→打包→校验和→发布：消除跨 job artifact
      # 传输的结构不确定性（曾两次在 SHA256SUMS 步骤失败且无日志可查）。
      - name: Build
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          for t in linux/amd64: linux/arm64: windows/amd64:.exe; do
            os=${t%%/*}; rest=${t#*/}; arch=${rest%%:*}; ext=${rest#*:}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
              go build -trimpath -ldflags "-s -w -X agenthub/internal/app.Version=$ver" \
              -o "pack/agenthub_$os-$arch$ext" ./cmd/agenthub
          done
      - name: Package
        shell: bash
        run: |
          cd pack
          for p in agenthub_linux-amd64 agenthub_linux-arm64 agenthub_windows-amd64.exe; do
            base=${p%.exe}; base=${base#agenthub_} # linux-amd64 / windows-amd64
            mkdir -p "agenthub_$base"
            cp "$p" "agenthub_$base/agenthub${p#agenthub_$base}"
            cp ../README.md "agenthub_$base/"
          done
          tar czf agenthub_linux-amd64.tar.gz agenthub_linux-amd64
          tar czf agenthub_linux-arm64.tar.gz agenthub_linux-arm64
          zip -qr agenthub_windows-amd64.zip agenthub_windows-amd64
          rm -rf agenthub_linux-amd64 agenthub_linux-arm64 agenthub_windows-amd64
          rm -f agenthub_linux-amd64 agenthub_linux-arm64 agenthub_windows-amd64.exe
          sha256sum agenthub_*.tar.gz agenthub_*.zip > SHA256SUMS
          ls -l
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pack/*.tar.gz
            pack/*.zip
            pack/SHA256SUMS
          generate_release_notes: true # changelog 由 PR/commit 生成
