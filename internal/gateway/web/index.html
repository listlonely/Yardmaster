<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgentHub 管理页</title>
  <style>
    body{font-family:system-ui,"Microsoft YaHei",sans-serif;max-width:44rem;margin:3rem auto;padding:0 1rem;color:#1e2430}
    h1{font-size:1.3rem} .card{border:1px solid #e4e7ec;border-radius:10px;padding:12px 16px;margin:10px 0}
    .muted{color:#5b6472;font-size:.85rem} code{background:#f1f3f7;border-radius:6px;padding:1px 6px;font-size:.85em}
    .pill{display:inline-block;border-radius:99px;padding:1px 10px;font-size:.8rem;background:#e9f7ee;color:#16a34a}
    table{width:100%;border-collapse:collapse;font-size:.9rem} td,th{padding:6px 8px;border-bottom:1px solid #e4e7ec;text-align:left}
  </style>
</head>
<body>
  <h1>AgentHub 本地网关 <span class="pill" id="status">加载中…</span></h1>
  <p class="muted">管理页完整版（总览/Providers/Agents/路由/观测）按 PRD 原型于后续周实现；本页为 W2 状态快照。</p>
  <div class="card"><b>运行状态</b><div id="state" class="muted">…</div></div>
  <div class="card"><b>Providers</b><table id="providers"><thead><tr><th>ID</th><th>名称</th><th>协议</th><th>账号数</th></tr></thead><tbody></tbody></table></div>
  <div class="card"><b>休眠中的账号</b><div id="resting" class="muted">无</div></div>
  <script>
    fetch('/api/state').then(r => r.json()).then(s => {
      document.getElementById('status').textContent = '运行中';
      document.getElementById('state').textContent =
        `版本 ${s.version} · 已运行 ${s.uptime} · ${s.resting && Object.keys(s.resting).length || 0} 个账号休眠中`;
      const tb = document.querySelector('#providers tbody');
      (s.providers || []).forEach(p => {
        tb.insertAdjacentHTML('beforeend', `<tr><td><code>${p.id}</code></td><td>${p.name}</td><td>${p.protocol}</td><td>${p.accounts}</td></tr>`);
      });
      if (!(s.providers || []).length) tb.innerHTML = '<tr><td colspan="4" class="muted">尚未配置 provider（providers.json）</td></tr>';
      const rk = Object.keys(s.resting || {});
      document.getElementById('resting').textContent = rk.length ? rk.map(k => `${k} → ${s.resting[k]}`).join('；') : '无';
    }).catch(() => document.getElementById('status').textContent = '无法连接 /api/state');
  </script>
</body>
</html>
